<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="四个阶段">
  <rect width="820" height="250" rx="12" fill="#ffffff"/>
  <style>
    .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328 }
    .s { font-size: 12px; fill: #6b7280 }
    .b { font-size: 13px; fill: #1f2328 }
    .box { fill: #f7f8fa; stroke: #d8dbe0; stroke-width: 1; rx: 8 }
    .hot { fill: #eef2ff; stroke: #3451b2 }
    .warn { fill: #fff4ed; stroke: #e07b39 }
    .arrow { stroke: #9aa1ab; stroke-width: 1.5; fill: none; marker-end: url(#a) }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aa1ab"/>
    </marker>
  </defs>
  <text class="t h" x="24" y="30">四步走：超过半小时的任务都这样拆</text>
  <rect class="t box" x="24" y="58" width="168" height="86" rx="10"/>
  <text class="t h" x="40" y="86">探索</text>
  <text class="t s" x="40" y="108">只读：读代码、查现状</text>
  <text class="t s" x="40" y="128">你确认它找对了地方</text>
  <path class="arrow" d="M196 101 L214 101"/>
  <rect class="t hot" x="220" y="58" width="168" height="86" rx="10"/>
  <text class="t h" x="236" y="86">计划</text>
  <text class="t s" x="236" y="108">写出打算怎么做</text>
  <text class="t s" x="236" y="128">你评审计划，成本最低</text>
  <path class="arrow" d="M392 101 L410 101"/>
  <rect class="t box" x="416" y="58" width="168" height="86" rx="10"/>
  <text class="t h" x="432" y="86">执行</text>
  <text class="t s" x="432" y="108">一步一步做，每步有检查</text>
  <text class="t s" x="432" y="128">你在检查点看结果</text>
  <path class="arrow" d="M588 101 L606 101"/>
  <rect class="t box" x="612" y="58" width="168" height="86" rx="10"/>
  <text class="t h" x="628" y="86">验证</text>
  <text class="t s" x="628" y="108">跑检查，给证据</text>
  <text class="t s" x="628" y="128">你读改动，亲眼看一次</text>
  <text class="t s" x="24" y="188">计划这一步最便宜：改一句计划，比改一百行代码省事。</text>
  <text class="t s" x="24" y="212">能用一句话说清要改什么的小任务，跳过前两步，直接做。</text>
</svg>
