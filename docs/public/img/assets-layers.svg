<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="四种资产与加载时机">
  <rect width="820" height="300" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa1ab"/></marker>
  </defs>
  <style>
    .t2 { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif }
    .h2 { font-size: 15px; font-weight: 600; fill: #1f2328 }
    .s2 { font-size: 12px; fill: #6b7280 }
    .b2 { font-size: 13px; fill: #1f2328 }
  </style>

  <text class="t2 h2" x="24" y="30">四种资产，区别在什么时候被读到</text>
  <text class="t2 s2" x="24" y="50">写在哪一层，决定它什么时候生效，也决定它能不能长。</text>
  <rect x="24" y="72" width="180" height="180" rx="8" fill="#eef2ff" stroke="#3451b2"/>
  <text class="t2 b2" x="40" y="96">全局指令</text>
  <text class="t2 s2" x="40" y="118">所有项目都生效</text>
  <text class="t2 s2" x="40" y="136">写你的通用习惯</text>
  <text class="t2 s2" x="40" y="154">越少越好</text>
  <rect x="220" y="72" width="180" height="180" rx="8" fill="#f7f8fa" stroke="#d8dbe0"/>
  <text class="t2 b2" x="236" y="96">项目指令</text>
  <text class="t2 s2" x="236" y="118">在这个仓库每次都读</text>
  <text class="t2 s2" x="236" y="136">构建命令、约定</text>
  <text class="t2 s2" x="236" y="154">要短，只写会做错的</text>
  <rect x="416" y="72" width="180" height="180" rx="8" fill="#f7f8fa" stroke="#d8dbe0"/>
  <text class="t2 b2" x="432" y="96">技能</text>
  <text class="t2 s2" x="432" y="118">用到这类活才加载</text>
  <text class="t2 s2" x="432" y="136">多步骤流程</text>
  <text class="t2 s2" x="432" y="154">可以写得很长</text>
  <rect x="612" y="72" width="184" height="180" rx="8" fill="#f7f8fa" stroke="#d8dbe0"/>
  <text class="t2 b2" x="628" y="96">记录</text>
  <text class="t2 s2" x="628" y="118">不自动加载</text>
  <text class="t2 s2" x="628" y="136">决策、复盘、踩坑</text>
  <text class="t2 s2" x="628" y="154">需要时去查</text>
  <text class="t2 s2" x="24" y="278">第一次直接做，第二次留意，第三次写下来。</text>
</svg>
