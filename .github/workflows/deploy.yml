# 校验文档并构建发布到 Cloudflare Workers（Static Assets）。
# 如需在 GitHub Actions 中自动部署，请在仓库 Settings → Secrets and variables → Actions 中配置：
# - CLOUDFLARE_API_TOKEN（需要 Workers Scripts Edit 权限）
# - CLOUDFLARE_ACCOUNT_ID
name: Check & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured; skipping Cloudflare deploy."
            exit 0
          fi
          npx wrangler deploy
